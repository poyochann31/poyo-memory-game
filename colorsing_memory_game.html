<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ぽよの神経衰弱</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px 12px 32px;
    background: #171923;
    color: #f7f7fb;
    font-family: system-ui, sans-serif;
    text-align: center;
  }
  h1 { font-size: 26px; margin: 8px 0; }
  .intro { color: #c5c7d3; font-size: 14px; }
  .stats {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin: 20px auto 14px;
  }
  .stat {
    background: #272b3b;
    border-radius: 12px;
    padding: 10px 18px;
    min-width: 105px;
  }
  .stat-label { color: #bfc3d5; font-size: 12px; }
  .stat-value { font-size: 23px; font-weight: bold; }
  #board {
    width: min(100%, 540px);
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 7px;
  }
  .card {
    aspect-ratio: 3 / 4;
    min-width: 0;
    border: 2px solid #555b7a;
    border-radius: 10px;
    background: #343a59;
    background-image: url("poyo_back.png");
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
    color: white;
    font-size: clamp(22px, 6vw, 38px);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .card.face-up {
    background: #fff;
    border-color: #c6b8ff;
    color: #222;
  }
  .card-image {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 7px;
    pointer-events: none;
  }
  .card.matched {
    background: #b9f0d0;
    border-color: #65c995;
    cursor: default;
  }
  .card:focus-visible, button:focus-visible {
    outline: 3px solid #ffe08a;
    outline-offset: 2px;
  }
  .actions { margin: 18px 0; }
  .action-button {
    background: #a996ff;
    color: #171323;
    border: 0;
    border-radius: 10px;
    padding: 12px 24px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
  #message {
    min-height: 52px;
    margin: 14px auto;
    line-height: 1.7;
    font-size: 15px;
  }
  .record { color: #ffe08a; }
  .note { color: #aeb2c5; font-size: 12px; margin-top: 24px; }
  .player { margin: 16px auto; max-width: 540px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .player input { min-width:0; width:min(260px,65vw); padding:11px; border-radius:9px; border:1px solid #555b7a; background:#272b3b; color:#fff; font-size:16px; }
  .rankings { max-width:760px; margin:28px auto; text-align:left; }
  .rank-tabs { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
  .rank-tabs button { border:1px solid #555b7a; background:#272b3b; color:#f7f7fb; border-radius:9px; padding:9px 12px; cursor:pointer; }
  .rank-tabs button.active { background:#a996ff; color:#171323; }
  .rank-panel { background:#272b3b; border-radius:12px; padding:14px; overflow-x:auto; }
  .rank-panel h3 { margin:0 0 10px; }
  .rank-panel ol { padding-left:26px; margin:0; }
  .rank-panel li { padding:5px 0; overflow-wrap:anywhere; }
  .status { color:#c5c7d3; font-size:13px; min-height:20px; margin:8px 0; }
  @media (max-width: 360px) {
    #board { gap: 4px; }
    .card { border-radius: 7px; }
    .stat { min-width: 90px; padding: 8px 12px; }
  }
</style>
</head>
<body>
<h1>🎸 ぽよの神経衰弱</h1>
<div class="intro">15組30枚、全部そろえるまでのタイムアタック！</div>

<div class="stats">
  <div class="stat">
    <div class="stat-label">タイム</div>
    <div class="stat-value" id="timer">00:00</div>
  </div>
  <div class="stat">
    <div class="stat-label">めくった回数</div>
    <div class="stat-value" id="moves">0</div>
  </div>
  <div class="stat">
    <div class="stat-label">自己ベスト</div>
    <div class="stat-value" id="best">--:--</div>
  </div>
</div>

<div class="player">
  <label for="playerName" style="align-self:center">ぽよに呼ばれている名前</label>
  <input id="playerName" maxlength="20" autocomplete="nickname" placeholder="ぽよに呼ばれている名前を入力">
</div>
<div id="board" aria-label="神経衰弱のカード"></div>

<div id="message" aria-live="polite">
  「ゲームを始める」を押して挑戦しよう！
</div>

<div class="actions">
  <button class="action-button" id="restart">ゲームを始める</button>
</div>

<div class="status" id="saveStatus" aria-live="polite">共通ランキングに接続しています…</div>
<section class="rankings" aria-label="共通ランキング">
  <h2>🏆 ぽよのランキング</h2>
  <div class="rank-tabs">
    <button type="button" class="active" data-rank="fast">タイムアタック</button>
    <button type="button" data-rank="moves">最短手数</button>
    <button type="button" data-rank="days">プレイ日数</button>
    <button type="button" data-rank="all">歴代タイムアタック</button>
  </div>
  <div class="rank-panel" id="rankPanel"><p>ランキングを読み込み中…</p></div>
</section>
<div class="note">
  共通ランキングにはクリア記録が保存されます。参加名は本人確認されません。<br>
  自己ベストはこの端末にも保存されます。ランキングへの反映には通信が必要です。
</div>

<script>
(() => {
  // カードの絵柄：GitHubにアップロードした15枚の画像
  const pictures = [
    "card1.png.PNG",
    "card2%2Cpng.PNG",
    "card3.png.PNG",
    "card4.png.PNG",
    "card5.png.PNG",
    "card6.png.PNG",
    "card7.png.PNG",
    "card8.png.PNG",
    "card9.png.PNG",
    "card10.png.PNG",
    "card11.png.PNG",
    "card12.png.PNG",
    "card13.png.PNG",
    "card14.png.PNG",
    "card15.png.PNG"
  ];

  const board = document.getElementById("board");
  const timerDisplay = document.getElementById("timer");
  const movesDisplay = document.getElementById("moves");
  const bestDisplay = document.getElementById("best");
  const message = document.getElementById("message");
  const restartButton = document.getElementById("restart");
  const playerNameInput = document.getElementById("playerName");
  const saveStatus = document.getElementById("saveStatus");
  const rankPanel = document.getElementById("rankPanel");

  // Supabase公開設定：この公開用キーだけを設定してください。秘密鍵は絶対に入れないでください。
  const SUPABASE_URL = "https://whhkacmvdsncciclsnmw.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_RX65B6PCsKcitE70f4UyNg_FB8niWGZ";
  const RECORDS_ENDPOINT = SUPABASE_URL + "/rest/v1/game_records";
  let rankingMode = "fast";
  let cachedRecords = [];

  let deck = [];
  let firstCard = null;
  let secondCard = null;
  let locked = true;
  let matchedPairs = 0;
  let moves = 0;
  let startedAt = null;
  let elapsedSeconds = 0;
  let elapsedMs = 0;
  let timerInterval = null;
  let flipTimeout = null;

  const bestKey = "poyoMemoryBestV1";

  function formatTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return String(mins).padStart(2, "0") + ":" +
           String(secs).padStart(2, "0");
  }

  function readBest() {
    try {
      const value = localStorage.getItem(bestKey);
      return value === null ? null : Number(value);
    } catch (e) {
      return null;
    }
  }

  function showBest() {
    const best = readBest();
    bestDisplay.textContent =
      best === null ? "--:--" : formatTime(best);
  }

  function updateTimer() {
    if (startedAt === null) return;
    elapsedMs = Date.now() - startedAt;
    elapsedSeconds = Math.floor(elapsedMs / 1000);
    timerDisplay.textContent = formatTime(elapsedSeconds);
  }

  function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  function renderBoard() {
    board.innerHTML = "";

    deck.forEach((card, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "card";
      button.textContent = "";
      button.setAttribute("aria-label", "カード " + (index + 1));
      button.addEventListener("click", () => flipCard(index));
      board.appendChild(button);
      card.element = button;
    });
  }

  function startGame() {
    clearInterval(timerInterval);
    clearTimeout(flipTimeout);

    deck = shuffle(
      pictures.flatMap((picture, pairId) => [
        { pairId, picture, open: false, matched: false },
        { pairId, picture, open: false, matched: false }
      ])
    );

    firstCard = null;
    secondCard = null;
    locked = false;
    matchedPairs = 0;
    moves = 0;
    startedAt = null;
    elapsedSeconds = 0;
    elapsedMs = 0;

    timerDisplay.textContent = "00:00";
    movesDisplay.textContent = "0";
    message.textContent = "同じ絵柄のカードを2枚ずつ見つけよう！";

    renderBoard();
  }

  function flipCard(index) {
    if (locked) return;

    const card = deck[index];
    if (card.open || card.matched) return;

    if (startedAt === null) {
      startedAt = Date.now();
      timerInterval = setInterval(updateTimer, 250);
    }

    card.open = true;
    card.element.textContent = "";
    const image = document.createElement("img");
    image.className = "card-image";
    image.src = card.picture;
    image.alt = "カードのイラスト";
    card.element.appendChild(image);
    card.element.classList.add("face-up");
    card.element.setAttribute("aria-label", "イラストのカード");

    if (firstCard === null) {
      firstCard = card;
      return;
    }

    secondCard = card;
    moves++;
    movesDisplay.textContent = String(moves);

    if (firstCard.pairId === secondCard.pairId) {
      firstCard.matched = true;
      secondCard.matched = true;
      firstCard.element.classList.add("matched");
      secondCard.element.classList.add("matched");

      firstCard = null;
      secondCard = null;
      matchedPairs++;

      if (matchedPairs === pictures.length) {
        finishGame();
      }
    } else {
      locked = true;
      flipTimeout = setTimeout(() => {
        [firstCard, secondCard].forEach(c => {
          c.open = false;
          c.element.textContent = "";
          c.element.classList.remove("face-up");
          c.element.setAttribute("aria-label", "裏向きのカード");
        });

        firstCard = null;
        secondCard = null;
        locked = false;
      }, 850);
    }
  }

  function finishGame() {
    clearInterval(timerInterval);
    updateTimer();
    locked = true;
    elapsedMs = Math.max(1, Date.now() - startedAt);

    let recordMessage = "";
    const previousBest = readBest();

    if (previousBest === null || elapsedSeconds < previousBest) {
      try {
        localStorage.setItem(bestKey, String(elapsedSeconds));
        recordMessage = "<br><span class='record'>自己ベスト更新！</span>";
      } catch (e) {
        recordMessage = "<br>記録を保存できませんでした。";
      }
    }

    showBest();
    message.innerHTML =
      "🎉 クリア！ おめでとう！<br>" +
      "タイム：" + formatTime(elapsedSeconds) +
      " ／ めくった回数：" + moves +
      recordMessage;
    saveRecord();
  }

  function configured() {
    return SUPABASE_PUBLISHABLE_KEY.startsWith("sb_publishable_");
  }

  async function apiFetch(url, options = {}) {
    const response = await fetch(url, {
      ...options,
      headers: {
        "apikey": SUPABASE_PUBLISHABLE_KEY,
        "Authorization": "Bearer " + SUPABASE_PUBLISHABLE_KEY,
        "Content-Type": "application/json",
        ...(options.headers || {})
      }
    });
    if (!response.ok) {
      const detail = await response.text();
      throw new Error("Supabase " + response.status + ": " + detail.slice(0, 240));
    }
    if (response.status === 204) return null;
    // SupabaseのPrefer: return=minimalでは、成功時に本文が空の場合がある。
    // 空の本文をJSONとして解析すると、保存成功後に誤ってエラー扱いになる。
    const responseText = await response.text();
    if (!responseText) return null;
    return JSON.parse(responseText);
  }

  async function saveRecord() {
    if (!configured()) {
      saveStatus.textContent = "Supabaseの公開用キーをHTMLに設定すると、共通ランキングに記録されます。";
      return;
    }
    const name = playerNameInput.value.trim().slice(0, 20);
    if (!name) {
      saveStatus.textContent = "今回の記録は未保存です。参加名を入力してから、もう一度プレイしてください。";
      return;
    }
    try {
      await apiFetch(RECORDS_ENDPOINT, {
        method: "POST",
        headers: { "Prefer": "return=minimal" },
        body: JSON.stringify({
          player_name: name,
          clear_time_ms: Math.max(1, Math.round(elapsedMs)),
          moves: Math.max(1, moves),
          played_on: new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Tokyo" })
        })
      });
      saveStatus.textContent = "記録を共通ランキングに保存しました。";
      await loadRankings();
    } catch (error) {
      saveStatus.textContent = "記録を保存できませんでした。Supabase設定を確認してください。";
      console.error(error);
    }
  }

  function monthStartJST() {
    const parts = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Tokyo", year:"numeric", month:"2-digit" }).formatToParts(new Date());
    const y = parts.find(p => p.type === "year").value;
    const m = parts.find(p => p.type === "month").value;
    return `${y}-${m}-01`;
  }
  function esc(value) {
    return String(value).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function timeText(ms) {
    const total = Math.floor(ms / 1000);
    return formatTime(total) + "." + String(Math.floor(ms % 1000 / 100)).padStart(1, "0");
  }
  function renderRanking() {
    if (!cachedRecords.length) {
      rankPanel.innerHTML = "<p>まだ記録がありません。最初の記録を作ってみよう！</p>";
      return;
    }
    const month = monthStartJST();
    const monthly = cachedRecords.filter(r => r.played_on >= month);
    let title = "", rows = [];
    if (rankingMode === "fast") {
      title = "タイムアタック（今月の最速クリアタイム）";
      const best = new Map();
      monthly.forEach(r => { if (!best.has(r.player_name) || r.clear_time_ms < best.get(r.player_name).clear_time_ms) best.set(r.player_name, r); });
      rows = [...best.values()].sort((a,b)=>a.clear_time_ms-b.clear_time_ms).slice(0,10).map(r=>`${esc(r.player_name)} — ${timeText(r.clear_time_ms)}（${r.moves}手）`);
    } else if (rankingMode === "moves") {
      title = "最短手数（今月の最少手数）";
      const best = new Map();
      monthly.forEach(r => { if (!best.has(r.player_name) || r.moves < best.get(r.player_name).moves || (r.moves === best.get(r.player_name).moves && r.clear_time_ms < best.get(r.player_name).clear_time_ms)) best.set(r.player_name, r); });
      rows = [...best.values()].sort((a,b)=>a.moves-b.moves || a.clear_time_ms-b.clear_time_ms).slice(0,10).map(r=>`${esc(r.player_name)} — ${r.moves}手（${timeText(r.clear_time_ms)}）`);
    } else if (rankingMode === "days") {
      title = "プレイ日数（今月プレイした日数）";
      const days = new Map();
      monthly.forEach(r => { if (!days.has(r.player_name)) days.set(r.player_name, new Set()); days.get(r.player_name).add(r.played_on); });
      rows = [...days.entries()].sort((a,b)=>b[1].size-a[1].size || a[0].localeCompare(b[0],"ja")).slice(0,10).map(([name, dates])=>`${esc(name)} — ${dates.size}日`);
    } else {
      title = "歴代タイムアタック（歴代最速クリアタイム）";
      const best = new Map();
      cachedRecords.forEach(r => { if (!best.has(r.player_name) || r.clear_time_ms < best.get(r.player_name).clear_time_ms) best.set(r.player_name, r); });
      rows = [...best.values()].sort((a,b)=>a.clear_time_ms-b.clear_time_ms).slice(0,10).map(r=>`${esc(r.player_name)} — ${timeText(r.clear_time_ms)}（${r.moves}手）`);
    }
    rankPanel.innerHTML = `<h3>${title}</h3>` + (rows.length ? `<ol>${rows.map(r=>`<li>${r}</li>`).join("")}</ol>` : "<p>今月の記録はまだありません。</p>");
  }
  async function loadRankings() {
    if (!configured()) {
      saveStatus.textContent = "公開用キーの設定待ちです。";
      rankPanel.innerHTML = "<p>公開用キーをHTMLに設定するとランキングが表示されます。</p>";
      return;
    }
    try {
      const data = await apiFetch(RECORDS_ENDPOINT + "?select=player_name,clear_time_ms,moves,played_on,created_at&order=created_at.desc&limit=5000");
      cachedRecords = Array.isArray(data) ? data : [];
      renderRanking();
      saveStatus.textContent = "共通ランキングに接続しました。";
    } catch (error) {
      rankPanel.innerHTML = "<p>ランキングを読み込めませんでした。Supabaseの設定を確認してください。</p>";
      saveStatus.textContent = "ランキング接続エラー。設定を確認してください。";
      console.error(error);
    }
  }
  document.querySelectorAll("[data-rank]").forEach(button => button.addEventListener("click", () => {
    rankingMode = button.dataset.rank;
    document.querySelectorAll("[data-rank]").forEach(b => b.classList.toggle("active", b === button));
    renderRanking();
  }));

  restartButton.addEventListener("click", startGame);
  showBest();
  startGame();
  loadRankings();
})();
</script>
</body>
</html>
